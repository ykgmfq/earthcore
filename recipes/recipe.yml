# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
---
name: earthcore
description: A custom uCore image for whatever lives below your stack.
base-image: ghcr.io/ublue-os/ucore
image-version: lts
modules:
  - type: dnf
    repos:
      copr:
        - adneos/systempub
    install:
      packages:
        - fish
        - systempub
  - type: files
    files:
      - source: files
        destination: /
  - type: signing
